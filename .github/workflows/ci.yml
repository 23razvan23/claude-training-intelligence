name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Compiles with -Xlint:all -Werror; integration tests use Testcontainers (Docker is on the runner).
      - run: ./gradlew --no-daemon build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [garmin-sync, calibration, tools]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # calibration needs its scientific stack; the other projects have no dependencies
      - run: if [ "${{ matrix.project }}" = calibration ]; then pip install -e '.[dev]'; else pip install pytest==8.3.3 ruff==0.8.1; fi
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  # The inspector runs on users' own machines; stock macOS ships Python 3.9.
  # setup-python has no 3.9 build for the current ubuntu-latest image, so use the
  # official 3.9 container instead.
  tools-py39:
    runs-on: ubuntu-latest
    container: python:3.9-slim
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest==8.3.3
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - run: sh -n deploy/backup/backup.sh

  # R-08: the backup must fail loudly and its output must restore. Runs backup.sh inside the
  # real backup image (busybox sh) against a throwaway TimescaleDB with synthetic data.
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy/backup/test-backup.sh
