name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Compiles with -Xlint:all -Werror; integration tests use Testcontainers (Docker is on the runner).
      - run: ./gradlew --no-daemon build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [garmin-sync, calibration, tools]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # calibration needs its scientific stack; garmin-sync its pinned Garmin library; tools has no dependencies
      - run: |
          case "${{ matrix.project }}" in
            calibration) pip install -e '.[dev]' ;;
            garmin-sync) pip install -r requirements.txt pytest==8.3.3 ruff==0.8.1 ;;
            *) pip install pytest==8.3.3 ruff==0.8.1 ;;
          esac
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  # The inspector runs on users' own machines; stock macOS ships Python 3.9.
  # setup-python has no 3.9 build for the current ubuntu-latest image, so use the
  # official 3.9 container instead.
  tools-py39:
    runs-on: ubuntu-latest
    container: python:3.9-slim
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest==8.3.3
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - run: sh -n deploy/backup/backup.sh
      # The `images` job below lists the services by hand (one cache scope each); fail here if
      # docker-compose.yml gains or loses a service that is not in that list.
      - name: images job covers every compose service
        run: |
          expected="app backup calibration garmin-sync web"
          actual=$(docker compose --profile tools config --services | grep -vx db | sort | tr '\n' ' ' | sed 's/ $//')
          [ "$actual" = "$expected" ] || { echo "compose services with an image: [$actual]; images job covers: [$expected]" >&2; exit 1; }

  # R-08: the backup must fail loudly and its output must restore. Runs backup.sh inside the
  # real backup image (busybox sh) against a throwaway TimescaleDB with synthetic data.
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh deploy/backup/test-backup.sh

  # A broken Dockerfile should fail the pull request, not the coach's `docker compose up --build`.
  # Builds every image in docker-compose.yml, including the `tools` profile (calibration), without
  # pushing. One cache scope per image, so a change in one image reuses the layers of the others.
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [app, web, garmin-sync, calibration, backup]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env   # compose refuses to parse without BACKUP_PASSPHRASE
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        env:
          COMPOSE_PROFILES: tools   # makes the profile-gated calibration service a bake target
        with:
          files: docker-compose.yml
          targets: ${{ matrix.service }}
          set: |
            *.cache-from=type=gha,scope=image-${{ matrix.service }}
            *.cache-to=type=gha,scope=image-${{ matrix.service }},mode=max
