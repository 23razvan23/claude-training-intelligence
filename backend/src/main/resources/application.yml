spring:
  application:
    name: training-intelligence
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/training}
    username: ${DB_USER:training}
    password: ${DB_PASSWORD:training}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB
      file-size-threshold: 1MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: 8081
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

app:
  bootstrap:
    coach-username: ${COACH_USERNAME:}
    coach-password: ${COACH_PASSWORD:}
    coach-display-name: ${COACH_DISPLAY_NAME:Coach}
  import:
    work-dir: ${IMPORT_WORK_DIR:${java.io.tmpdir}/training-imports}
    # Max time between a Garmin FIT file start and a summarized activity start
    # for them to be treated as the same activity. [configurable]
    activity-match-tolerance-seconds: 120

  # Module 1 feature engineering. Every number below is a starting value, not
  # settled science: [configurable], with the reason next to it.
  metrics:
    feature-version: f3   # f2: all-day HR background load; f3: whole-day HR zone minutes
    # Banister TRIMP weighting k1*e^(k2*HRr): Banister (1991) / Morton (1990) sex constants.
    banister-male-k1: 0.64
    banister-male-k2: 1.92
    banister-female-k1: 0.86
    banister-female-k2: 1.67
    # Edwards zone TRIMP: zone lower bounds as % of HRmax, weights 1..5 (Edwards 1993).
    edwards-zone-floors: [0.50, 0.60, 0.70, 0.80, 0.90]
    # Whole-day zone minutes: lower bounds as fractions of heart-rate reserve (Karvonen).
    hrr-zone-floors: [0.50, 0.60, 0.70, 0.80, 0.90]
    # Gaps longer than this between HR samples are not integrated (watch paused / dropout).
    max-sample-gap-seconds: 10
    # All-day monitoring HR is sparse (~1-2 min); longer gaps mean the watch was off.
    monitoring-max-gap-seconds: 300
    # Personal baseline: trailing window, minimum valid days before z-scores are produced.
    baseline-window-days: 30
    baseline-min-days: 14
    # Live holdout vs Whoop (ADR 0009), frozen into model_version.holdout_targets at activation.
    # Compared recovery days needed before a pass mark may be called met: the most the
    # coach's Whoop subscription (to 2027-02-19) can give with some days excluded (coach, 2026-11-15).
    holdout-min-recovery-days: 90
    # Confidence of the Wilson interval shown next to every rate: the conventional 95%.
    holdout-confidence: 0.95

logging:
  level:
    root: INFO
    # Never log request bodies: they carry health data and credentials.
    org.springframework.web: WARN
