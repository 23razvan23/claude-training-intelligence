spring:
  application:
    name: training-intelligence
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/training}
    username: ${DB_USER:training}
    password: ${DB_PASSWORD:training}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 4GB
      max-request-size: 4GB
      file-size-threshold: 1MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: 8081
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs

app:
  bootstrap:
    coach-username: ${COACH_USERNAME:}
    coach-password: ${COACH_PASSWORD:}
    coach-display-name: ${COACH_DISPLAY_NAME:Coach}
  import:
    work-dir: ${IMPORT_WORK_DIR:${java.io.tmpdir}/training-imports}
    # Max time between a Garmin FIT file start and a summarized activity start
    # for them to be treated as the same activity. [configurable]
    activity-match-tolerance-seconds: 120

  # Module 1 feature engineering. Every number below is a starting value, not
  # settled science: [configurable], with the reason next to it.
  metrics:
    feature-version: f3   # f2: all-day HR background load; f3: whole-day HR zone minutes
    # Banister TRIMP weighting k1*e^(k2*HRr): Banister (1991) / Morton (1990) sex constants.
    banister-male-k1: 0.64
    banister-male-k2: 1.92
    banister-female-k1: 0.86
    banister-female-k2: 1.67
    # Edwards zone TRIMP: zone lower bounds as % of HRmax, weights 1..5 (Edwards 1993).
    edwards-zone-floors: [0.50, 0.60, 0.70, 0.80, 0.90]
    # Whole-day zone minutes: lower bounds as fractions of heart-rate reserve (Karvonen).
    hrr-zone-floors: [0.50, 0.60, 0.70, 0.80, 0.90]
    # Gaps longer than this between HR samples are not integrated (watch paused / dropout).
    max-sample-gap-seconds: 10
    # All-day monitoring HR is sparse (~1-2 min); longer gaps mean the watch was off.
    monitoring-max-gap-seconds: 300
    # Personal baseline: trailing window, minimum valid days before z-scores are produced.
    baseline-window-days: 30
    baseline-min-days: 14
    # Live holdout vs Whoop (ADR 0009), frozen into model_version.holdout_targets at activation.
    # Compared recovery days needed before a pass mark may be called met: the most the
    # coach's Whoop subscription (to 2027-02-19) can give with some days excluded (coach, 2026-11-15).
    holdout-min-recovery-days: 90
    # Confidence of the Wilson interval shown next to every rate: the conventional 95%.
    holdout-confidence: 0.95
    # Last day of the coach's Whoop subscription (no extension, 2026-11-15). Not a sports-science
    # number: after this day no Whoop data can arrive, so the comparison is final (ADR 0009 H6).
    holdout-whoop-end: 2027-02-19
    # Drift window on the Holdout view: the last 4 weeks (ADR 0009 H5 example). Display only, never
    # used for the verdict.
    holdout-rolling-days: 28
  # Today screen (stage 1b-2a, ADR 0014). Display only: nothing here changes a stored score.
  today:
    # Personal strain range shown next to today's strain: percentiles of the athlete's own strain on the
    # full-coverage days of the last 4 weeks. A heuristic ("about your usual on green, less on yellow,
    # little on red"), not established science; the planned session's strain replaces it in Phase 2.
    strain-target-window-days: 28   # 4 weeks: recent enough to follow training blocks, long enough to be stable
    strain-target-min-days: 14      # half the window: with fewer days the percentiles mean little, so no target
    green-percentiles: [50, 75]     # green: from your median to your upper quarter
    yellow-percentiles: [25, 50]    # yellow: from your lower quarter to your median
    red-percentiles: [0, 25]        # red: up to your lower quarter (0 = from strain 0)

  # Trends screen (stage 1b-2b, ADR 0016). Display only: nothing here changes a stored score.
  trends:
    history-days: 365   # 12 months: the longest range the screen offers
    warmup-days: 90     # about three 28-day chronic windows, so the load lines are settled on the first visible day

  # Garmin daily sync (stage 1b-4, ADR 0011). Both secrets come from .env; empty values disable
  # sync without stopping the app (ADR 0011 D10).
  garmin:
    token-key: ${GARMIN_TOKEN_KEY:}
    sync-secret: ${GARMIN_SYNC_SECRET:}
    sidecar-url: ${GARMIN_SYNC_URL:http://localhost:8090}
    # A login can try several Garmin sign-in routes in turn; 60 s leaves room for that
    # without leaving the Connect button hanging for minutes. [configurable]
    sidecar-timeout-seconds: 60
    sync:
      # Days before today fetched again on every sync: covers a watch that syncs late and Garmin
      # re-processing a night's sleep. A re-fetched day that changed is a revision (ADR 0010). [configurable]
      refetch-days: 2
      # Waits before the 2nd and 3rd attempt when Garmin is unavailable or rate limited: often enough to
      # be ready by 08:00 after a 07:00 start, rare enough not to get the account blocked. [configurable]
      retry-delays-minutes: [10, 30]
      # Longest range "Check against export" accepts: two weeks is plenty to compare, and keeps one
      # request to Garmin small. [configurable]
      check-max-days: 14
      # A fetch downloads FIT files for several days; 5 minutes covers a slow connection. [configurable]
      timeout-seconds: 300
      scheduler-enabled: true
      # The morning run (ADR 0015 D9): starts at this time in the athlete's timezone, or as soon as the
      # Mac is awake again that day. 07:00 leaves an hour of slack (two retries) before the spec's 08:00
      # deadline, and Garmin has normally received the night from the watch by then. [configurable]
      morning-enabled: true
      morning-time: "07:00"

logging:
  level:
    root: INFO
    # Never log request bodies: they carry health data and credentials.
    org.springframework.web: WARN
