[project]
name = "calibration"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.1.3",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "matplotlib==3.9.2",
  "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.8.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["calibration"]

[tool.setuptools.package-data]
calibration = ["targets.json"]

[tool.ruff]
line-length = 170  # report.py builds HTML in long f-strings
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:matplotlib.*", "ignore:.*deprecated - use.*"]
