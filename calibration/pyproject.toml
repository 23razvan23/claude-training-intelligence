[project]
name = "calibration"
version = "0.1.0"
requires-python = ">=3.12"
# Pinned for Phase 1; nothing imports them yet.
dependencies = [
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "statsmodels==0.14.4",
  "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.8.1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]

[tool.pytest.ini_options]
pythonpath = ["."]
