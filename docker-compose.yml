# One-command local setup: cp .env.example .env && docker compose up --build
name: training-intelligence

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-training}
      POSTGRES_USER: ${POSTGRES_USER:-training}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-training}
      DB_USER: ${POSTGRES_USER:-training}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      COACH_USERNAME: ${COACH_USERNAME:-}
      COACH_PASSWORD: ${COACH_PASSWORD:-}
      COACH_DISPLAY_NAME: ${COACH_DISPLAY_NAME:-Coach}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - import-work:/var/lib/training-imports

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8080}:80"

  # Garmin Connect sync sidecar. Phase 0 ships only the adapter interface and a
  # health endpoint; real sync arrives in Phase 1.
  garmin-sync:
    build: ./garmin-sync
    restart: unless-stopped
    expose:
      - "8090"

  # Module 1 calibration job, run on demand (not started by `docker compose up`):
  #   docker compose run --build --rm calibration --athlete 1
  # --build matters: `docker compose up --build` does not rebuild on-demand services,
  # so without it an old image of this job keeps running after an update.
  calibration:
    build: ./calibration
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-training}
      PGUSER: ${POSTGRES_USER:-training}
      PGPASSWORD: ${POSTGRES_PASSWORD}

  backup:
    build: ./deploy/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-training}
      POSTGRES_USER: ${POSTGRES_USER:-training}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
    volumes:
      - ./backups:/backups

volumes:
  db-data:
  import-work:
