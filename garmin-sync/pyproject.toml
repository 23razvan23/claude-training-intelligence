[project]
name = "garmin-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []  # Phase 1 adds garminconnect / garth here

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.8.1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]

[tool.pytest.ini_options]
pythonpath = ["."]
